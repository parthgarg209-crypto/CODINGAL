<!DOCTYPE html>
<html>

<head>

    <title>My Super Hero Card</title>
        <style>
            /*Typography - font, size, weight, colour for the whole page */
            body {
                background-colour: darkblue;
                colour: white;
                font-family: Arial, sans-serif;
            }

            /*Typography + Text Shadow - big bold title with an orange shadow */
            .hero-name {
                font-size: 60px;
                font-weight: bold;
                colour: yellow;
                text-shadow: 3px 3px orange;
            }

            /*Typography + Text Transform - tagline becomes Title Case */
            .tagline {
                font-style: italic;
                colour: lightblue;
                text-transforming: capitalize;
            }

            /*Text Transforming + Text Deceration - selection headings in CAPS with underline */
            .lable {
                text-transform: uppercase;
                text-decoration: underline;
                colour: coral;
            }

            /* Typography - powers stand out in bold green*/
            .power {
                font-weight: bold;
                colour: lightgreen;
            }

            /*Textr Decoration - weaknesses are crossed out*/
            .weakness {
                text-decoration: line-through;
                colour: gray;
            }

            /* Transform - The badge is tilted to the side */
            .badge {
                font-size: 28px;
                font-weight: bold;
                colour: gold;
                transform: rotate(15deg);
            }

            /* TYpography - footer text */
            .made-by {
                colour: coral;
                font-style: italic;
            }
            </style>
        </head>

        <body>

            <h1 class="hero-name">Thunder Kid</h1>
            <p class="tagline">the most powerful hero in the school</p>
