<!DOCTYPE html>
<html>

<body>
    <h2>JavaScript Arrays</h2>
    <h2>Join() and pop()</h2>
    <p>The join() method joins array elements into a string and pop() method removes the last element from an array.</p>
    <p id="myjoin"></p>
    <p id="myfirstpop"></p>
    <p id="mysecondpop"></p>
    <script>
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = fruits.join(" or ");
        document.getElementById("myfirstpop").innerHTML = fruits.pop();
        document.getElementById("mysecondpop").innerHTML = fruits.pop();
        document.getElementById("mythirdpop").innerHTML = fruits
   
   </script>

</body>
</html>
