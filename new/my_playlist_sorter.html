    <div class="container py-4">

        <!-- TOPIC 1 & 2: sort() and reverse() -->
         <div class="card mh-4">
            <div class="card-body">
                <h3 class="card-title">Sort Songs</h3>
                <button class="btn btn-primary mr-2 " onclick="sortSongs()">Sort Songs</button>
                <button class="btn btn-success             " onclick="reverseSongs()">Reverse Songs</button>
         </div>
</body>
<button class="btn btn-info" onclick="displaySongs()">Display Songs</button>
        <div id="songList" class="mt-3"></div>
    </div>

    <script>
        let songs = ["Song A", "Song C", "Song B", "Song D"];

        function sortSongs() {
            songs.sort();
            displaySongs();
        }

        function reverseSongs() {
            songs.reverse();
            displaySongs();
        }

        function displaySongs() {
            const songListDiv = document.getElementById("songList");
            songListDiv.innerHTML = "<ul>" + songs.map(song => "<li>" + song + "</li>").join("") + "</ul>";
        }
    </script>
